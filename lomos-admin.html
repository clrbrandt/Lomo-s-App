<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='90' text-anchor='middle' dominant-baseline='middle'>🏪</text></svg>">
  <title>Lomo's Miscellaneous - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; }
    .success-msg { background: #d1fae5; color: #047857; }
    .error-msg { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Global state
    let inventory = [
      { name: 'Action Work', cost: 30, stock: 50, totalSold: 0, revenue: 0, prices: [50, 30] },
      { name: 'Abdul Updown', cost: 15, stock: 50, totalSold: 0, revenue: 0, prices: [15, 30] },
      { name: 'Snoek', cost: 30, stock: 50, totalSold: 0, revenue: 0, prices: [30, 50, 100] },
      { name: 'Reserved', cost: 0, stock: 50, totalSold: 0, revenue: 0, prices: [0] },
    ];

    let selectedItemIndex = 0;
    let selectedPrice = 50;
    let quantity = 1;
    let message = { type: '', text: '' };
    let showAddItemForm = false;

    // Utility function to clear message after delay
    const clearMessageAfterDelay = () => {
      setTimeout(() => {
        message = { type: '', text: '' };
        render();
      }, 3000);
    };

    // Action functions
    const recordSale = () => {
      const qty = parseInt(quantity);
      if (isNaN(qty) || qty <= 0) {
        message = { type: 'error', text: 'Please enter a valid quantity greater than 0.' };
        render();
        return;
      }

      const currentItem = inventory[selectedItemIndex];
      if (currentItem.stock < qty) {
        message = { type: 'error', text: `Insufficient stock! Only ${currentItem.stock} units available.` };
        render();
        return;
      }

      inventory[selectedItemIndex].stock -= qty;
      inventory[selectedItemIndex].totalSold += qty;
      inventory[selectedItemIndex].revenue += selectedPrice * qty;

      message = { type: 'success', text: `✓ Sold ${qty} unit(s) of ${currentItem.name} at R${selectedPrice} each!` };
      quantity = 1;
      render();
      clearMessageAfterDelay();
    };

    const restock = () => {
      const qty = parseInt(quantity);
      if (isNaN(qty) || qty <= 0) {
        message = { type: 'error', text: 'Please enter a valid quantity greater than 0.' };
        render();
        return;
      }

      inventory[selectedItemIndex].stock += qty;
      message = { type: 'success', text: `✓ Added ${qty} unit(s) to ${inventory[selectedItemIndex].name}.` };
      quantity = 1;
      render();
      clearMessageAfterDelay();
    };

    const resetAllStock = () => {
      if (confirm('Reset ALL stock levels to 0?')) {
        inventory.forEach(item => {
          item.stock = 0;
        });
        message = { type: 'success', text: '✓ All stock levels reset to 0.' };
        render();
        clearMessageAfterDelay();
      }
    };

    const clearAllItems = () => {
      if (confirm('Delete ALL items? This cannot be undone.')) {
        inventory = [];
        showAddItemForm = false;
        selectedItemIndex = 0;
        message = { type: 'success', text: '✓ All inventory cleared.' };
        render();
        clearMessageAfterDelay();
      }
    };

    const toggleAddForm = () => {
      showAddItemForm = !showAddItemForm;
      message = { type: '', text: '' };
      render();
    };

    const submitAddItem = () => {
      const name = document.getElementById('newItemName')?.value.trim() || '';
      const cost = parseInt(document.getElementById('newItemCost')?.value || 0);
      const stock = parseInt(document.getElementById('newItemStock')?.value || 0);
      const pricesStr = document.getElementById('newItemPrices')?.value || '';

      if (!name) {
        message = { type: 'error', text: 'Item name is required.' };
        render();
        return;
      }
      if (isNaN(cost) || cost < 0) {
        message = { type: 'error', text: 'Cost price must be a valid number.' };
        render();
        return;
      }
      if (isNaN(stock) || stock < 0) {
        message = { type: 'error', text: 'Stock must be a valid number.' };
        render();
        return;
      }
      if (!pricesStr.trim()) {
        message = { type: 'error', text: 'At least one sale price is required.' };
        render();
        return;
      }

      const prices = pricesStr.split(',').map(p => {
        const num = parseInt(p.trim());
        return isNaN(num) ? 0 : num;
      });

      inventory.push({
        name,
        cost,
        stock,
        totalSold: 0,
        revenue: 0,
        prices
      });

      showAddItemForm = false;
      selectedItemIndex = inventory.length - 1;
      selectedPrice = inventory[selectedItemIndex].prices[0];
      message = { type: 'success', text: `✓ ${name} added successfully!` };
      render();
      clearMessageAfterDelay();
    };

    const updateStockLevel = (idx, newStockValue) => {
      const newStock = parseInt(newStockValue);
      if (!isNaN(newStock) && newStock >= 0) {
        inventory[idx].stock = newStock;
        message = { type: 'success', text: `✓ ${inventory[idx].name} stock updated to ${newStock} units.` };
        render();
        clearMessageAfterDelay();
      }
    };

    const deleteItem = (idx) => {
      if (confirm(`Delete "${inventory[idx].name}"?`)) {
        inventory.splice(idx, 1);
        if (selectedItemIndex >= inventory.length && selectedItemIndex > 0) {
          selectedItemIndex--;
        }
        if (inventory.length > 0) {
          selectedPrice = inventory[selectedItemIndex].prices[0];
        }
        message = { type: 'success', text: '✓ Item deleted.' };
        render();
        clearMessageAfterDelay();
      }
    };

    const render = () => {
      const totalRevenue = inventory.reduce((acc, item) => acc + item.revenue, 0);
      const totalItemsSold = inventory.reduce((acc, item) => acc + item.totalSold, 0);

      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
        <div class="max-w-7xl mx-auto p-6">
          <!-- Header -->
          <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-300">
            <div>
              <h1 class="text-3xl font-bold text-slate-800">Lomo's Miscellaneous</h1>
              <p class="text-sm text-slate-500 mt-1">Admin Inventory & Sales Dashboard</p>
            </div>
            <div class="flex gap-6">
              <div class="bg-white p-4 rounded-lg shadow border border-slate-200 text-right">
                <p class="text-xs text-slate-500 uppercase font-semibold tracking-wide">Total Revenue</p>
                <p class="text-2xl font-bold text-emerald-600 mt-2">R ${totalRevenue.toFixed(2)}</p>
              </div>
              <div class="bg-white p-4 rounded-lg shadow border border-slate-200 text-right">
                <p class="text-xs text-slate-500 uppercase font-semibold tracking-wide">Units Sold</p>
                <p class="text-2xl font-bold text-blue-600 mt-2">${totalItemsSold}</p>
              </div>
            </div>
          </div>

          <!-- Message -->
          ${message.text ? `
            <div class="p-4 mb-6 rounded-lg flex items-center gap-3 ${message.type === 'error' ? 'error-msg' : 'success-msg'} animate-pulse">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"/>
              </svg>
              <span class="font-medium">${message.text}</span>
            </div>
          ` : ''}

          <!-- Admin Controls -->
          <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-6">
            <button onclick="window.toggleAddForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
              Add New Item
            </button>

            <button onclick="window.resetAllStock()" class="bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
              Reset All Stock to 0
            </button>

            <button onclick="window.clearAllItems()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
              Clear All Items
            </button>

            <div class="text-right text-sm text-slate-600 flex flex-col justify-center">
              <p class="font-semibold">${inventory.length} items</p>
              <p class="text-slate-500">Total stock: ${inventory.reduce((a, i) => a + i.stock, 0)} units</p>
            </div>
          </div>

          <!-- Add Item Form -->
          ${showAddItemForm ? `
            <div class="bg-white p-6 rounded-xl shadow border border-slate-200 mb-6">
              <h2 class="text-lg font-semibold text-slate-800 mb-4">Add New Item</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Item Name</label>
                  <input type="text" id="newItemName" placeholder="e.g., Action Work" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Cost Price (R)</label>
                  <input type="number" id="newItemCost" placeholder="30" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" min="0">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Initial Stock Quantity</label>
                  <input type="number" id="newItemStock" placeholder="50" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" min="0">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Sale Prices (R) - Comma Separated</label>
                  <input type="text" id="newItemPrices" placeholder="50, 75, 100" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
              </div>
              <div class="flex gap-3 mt-4">
                <button onclick="window.submitAddItem()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg transition">
                  Add Item
                </button>
                <button onclick="window.toggleAddForm()" class="bg-slate-300 hover:bg-slate-400 text-slate-800 font-semibold py-2 px-6 rounded-lg transition">
                  Cancel
                </button>
              </div>
            </div>
          ` : ''}

          <!-- Main Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Sales Control Panel -->
            <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
              <h2 class="text-lg font-semibold text-slate-800 mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                Record Sale
              </h2>
              
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Select Item</label>
                  <select id="itemSelect" onchange="
                    selectedItemIndex = parseInt(this.value);
                    selectedPrice = inventory[selectedItemIndex].prices[0];
                    render();
                  " class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    ${inventory.map((item, idx) => `<option value="${idx}">${item.name} • R${item.cost} cost • ${item.stock} units</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Select Sale Price</label>
                  <select id="priceSelect" onchange="selectedPrice = Number(this.value)" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    ${inventory[selectedItemIndex].prices.map(p => `<option value="${p}">R ${p}</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-2">Quantity</label>
                  <input type="number" id="quantityInput" value="${quantity}" min="1" onchange="quantity = this.value" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <button onclick="window.recordSale()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg transition flex items-center justify-center gap-2 mt-6">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                  </svg>
                  Record Sale
                </button>

                <button onclick="window.restock()" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2.5 px-4 rounded-lg transition flex items-center justify-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                  </svg>
                  Restock
                </button>
              </div>
            </div>

            <!-- Inventory Table -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border border-slate-200">
              <h2 class="text-lg font-semibold text-slate-800 mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m0 0l8 4m-8-4v10l8 4m0-10l8 4m-8-4v10"/>
                </svg>
                Inventory
              </h2>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                  <thead>
                    <tr class="border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase bg-slate-50">
                      <th class="p-3">Item</th>
                      <th class="p-3">Cost</th>
                      <th class="p-3">Stock</th>
                      <th class="p-3">Sold</th>
                      <th class="p-3 text-right">Revenue</th>
                      <th class="p-3 text-center">Delete</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${inventory.map((item, idx) => `
                      <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-medium text-slate-800">${item.name}</td>
                        <td class="p-3 text-slate-600">R ${item.cost}</td>
                        <td class="p-3">
                          <input type="number" value="${item.stock}" min="0" onchange="window.updateStockLevel(${idx}, this.value)" class="w-20 p-1.5 text-sm border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                        </td>
                        <td class="p-3 text-slate-600 font-medium">${item.totalSold}</td>
                        <td class="p-3 text-right font-bold text-emerald-600">R ${item.revenue.toFixed(2)}</td>
                        <td class="p-3 text-center">
                          <button onclick="window.deleteItem(${idx})" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs font-semibold py-1 px-2 rounded transition">
                            Delete
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    // Expose functions globally
    window.recordSale = recordSale;
    window.restock = restock;
    window.resetAllStock = resetAllStock;
    window.clearAllItems = clearAllItems;
    window.toggleAddForm = toggleAddForm;
    window.submitAddItem = submitAddItem;
    window.updateStockLevel = updateStockLevel;
    window.deleteItem = deleteItem;
    window.render = render;

    // Initial render
    render();

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed'));
      });
    }
  </script>
</body>
</html>
